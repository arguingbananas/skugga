name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; no job here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax-check JavaScript
        run: npm run check
      - name: Byte-compile the Python pipeline
        run: python3 -m py_compile pipeline/*.py
      - name: Viewer smoke test (headless Chrome)
        run: npm run smoke
