name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; no job here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pyflakes (Ubuntu package, not pip)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pyflakes
      - name: Install actionlint (pinned release, checksum verified)
        run: bash tools/install-actionlint.sh
      - name: Syntax-check JavaScript
        run: npm run check
      - name: Byte-compile the Python code
        run: python3 -m py_compile pipeline/*.py server/*.py tests/*.py
      - name: Unit tests (game rules)
        run: npm test
      - name: Lint (ESLint, pyflakes, actionlint)
        run: npm run lint
      - name: Viewer smoke test (headless Chrome)
        run: npm run smoke
